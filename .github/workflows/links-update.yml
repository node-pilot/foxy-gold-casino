# LEVR Links Workflow v1.0.0
# Generated by LEVR CMS v1.2.2 — do not edit by hand; managed via the
# CMS workflow upgrade (POST /api/workflows/:siteId/upgrade).
name: links

on:
  push:
    branches: [main]
    paths:
      - 'public/links.json'
      - '.github/workflows/links-update.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate public/links.json
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = 'public/links.json';
          if (!fs.existsSync(path)) {
            console.log('No public/links.json — nothing to validate (OK).');
            process.exit(0);
          }
          let raw;
          try {
            raw = fs.readFileSync(path, 'utf8');
          } catch (e) {
            console.error('::error::cannot read public/links.json: ' + e.message);
            process.exit(1);
          }
          let data;
          try {
            data = JSON.parse(raw);
          } catch (e) {
            console.error('::error::public/links.json is not valid JSON: ' + e.message);
            process.exit(1);
          }
          // Accept either the assignment array shape or a { assignments: [...] }
          // / { links: [...] } envelope. Each entry must carry at minimum an id
          // + a target_url (the runtime resolves codes -> targets by these).
          const list = Array.isArray(data)
            ? data
            : (Array.isArray(data.assignments) ? data.assignments
              : (Array.isArray(data.links) ? data.links : null));
          if (!list) {
            console.error('::error::public/links.json must be an array or contain an "assignments"/"links" array.');
            process.exit(1);
          }
          let bad = 0;
          list.forEach((a, i) => {
            if (!a || typeof a !== 'object') { console.error('::error::entry ' + i + ' is not an object'); bad++; return; }
            const id = a.assignment_id || a.id;
            if (!id) { console.error('::error::entry ' + i + ' missing assignment_id/id'); bad++; }
            if (!a.target_url) { console.error('::error::entry ' + i + ' (' + (id || '?') + ') missing target_url'); bad++; }
          });
          if (bad > 0) {
            console.error('::error::public/links.json failed validation (' + bad + ' problem(s)).');
            process.exit(1);
          }
          console.log('public/links.json valid — ' + list.length + ' assignment(s).');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Links validated\n\n' + list.length + ' affiliate assignment(s) OK.\n');
          SCRIPT
