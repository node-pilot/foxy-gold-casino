# LEVR Deploy Workflow v2.2.0
# Generated by LEVR CMS v1.2.2 — do not edit by hand; managed via the
# CMS workflow upgrade (POST /api/workflows/:siteId/upgrade).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # QUEUE, do not cancel. The builder fires a STORM of deploy.yml runs per build
  # (deploy_worker commits wrangler.jsonc / sitemap / robots / llms / links.json
  # in separate pushes, then finish() re-commits links.json — each push triggers
  # this workflow). cancel-in-progress: true killed the in-flight runs; a cancel
  # landing DURING the wrangler-deploy step can leave the Worker torn down /
  # undeployed (CF 1042). Queueing serialises the burst so each run completes its
  # deploy and the last commit still wins — over-trigger protection without the
  # mid-deploy teardown risk.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # wrangler 4.x requires Node >=22; pin Node 24 (current LTS on GitHub
      # runners — Node 20 was hitting pnpm exit 1). Keep in sync with preview.yml.
      # No `cache: pnpm` — fresh agent-generated repos don't ship a
      # pnpm-lock.yaml and setup-node hard-fails when its cache path can't find one.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # --no-frozen-lockfile: first deploy generates the lockfile on the runner;
      # subsequent deploys re-install against it.
      - run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
