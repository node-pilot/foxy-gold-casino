# LEVR Preview Workflow v2.2.0
# Generated by LEVR CMS v1.2.2 — do not edit by hand; managed via the
# CMS workflow upgrade (POST /api/workflows/:siteId/upgrade).
name: preview

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  # CANCEL in-progress runs (unlike deploy.yml, which queues). Harness site-task
  # delivery pushes twice ~2s apart (branch-ref creation + delivery commit),
  # spawning two runs of this workflow with no ordering guarantee — the OLDER
  # tree can win the preview alias by finishing last. Cancelling the stale run
  # is safe here because `versions upload` never touches the live deployment:
  # a cancelled upload just leaves the previously-uploaded aliased version
  # serving. Latest-wins is the correct preview semantic.
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.preview-url.outputs.url }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      # wrangler 4.x requires Node >=22 — on Node 20 wrangler-action's version
      # probe fails and it silently downgrades to its bundled wrangler 3, which
      # lacks the preview-alias upload command.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Compute preview alias + worker name
        id: meta
        run: |
          # Sanitize branch -> alias. Mirrors sanitizeBranchAlias():
          # lowercase, non-[a-z0-9-] -> '-', collapse, trim, max 20 chars.
          BRANCH="${{ github.head_ref || github.ref_name }}"
          ALIAS=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\{2,\}/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-20)
          [ -z "$ALIAS" ] && ALIAS="preview"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          # Worker name = the name field in wrangler.jsonc. deploy_worker patches
          # this to the repo slug before the first deploy, so reading it at
          # runtime keeps the preview host correct per-site.
          WORKER=$(grep -m1 '"name"' wrangler.jsonc | sed 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          [ -z "$WORKER" ] && WORKER="${{ github.event.repository.name }}"
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"
          echo "Branch: $BRANCH -> Alias: $ALIAS | Worker: $WORKER"

      - name: Deploy preview (aliased version upload)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.meta.outputs.alias }}

      - name: Resolve preview URL
        id: preview-url
        run: |
          ALIAS="${{ steps.meta.outputs.alias }}"
          WORKER="${{ steps.meta.outputs.worker }}"
          DEPLOY_URL="${{ steps.deploy.outputs.deployment-url }}"
          if [ -n "$DEPLOY_URL" ]; then
            PREVIEW_URL="$DEPLOY_URL"
          else
            PREVIEW_URL="https://$ALIAS-$WORKER.workers.dev"
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview deployed"
            echo ""
            echo "**Preview URL:** $PREVIEW_URL"
            echo ""
            echo "Password-gated (.workers.dev only): levr:preview123"
            echo ""
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Branch | ${{ github.head_ref || github.ref_name }} |"
            echo "| Alias  | $ALIAS |"
            echo "| Worker | $WORKER |"
            echo "| Commit | ${{ github.sha }} |"
            echo ""
            echo "> Merge to main for production deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview-url.outputs.url }}';
            const branch = '${{ github.head_ref || github.ref_name }}';
            const alias = '${{ steps.meta.outputs.alias }}';
            const sha = '${{ github.sha }}'.slice(0, 7);

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const botComment = comments.data.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Preview:'),
            );

            const body = '**Preview:** ' + url + '\n\n' +
              'Password-gated (levr:preview123).\n\n' +
              '| Detail | Value |\n' +
              '|--------|-------|\n' +
              '| Branch | **' + branch + '** |\n' +
              '| Alias | **' + alias + '** |\n' +
              '| Commit | **' + sha + '** |\n\n' +
              '_Updated on each push to this branch._';

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
